# ==============================================================================
# File: .gitlab-ci.yml (Exercise 03 - SS09)
# Mô tả: Pipeline CI/CD gồm 2 stage tuần tự: test (với PostgreSQL service) và build (lưu artifacts)
# ==============================================================================

image: gradle:7.6-jdk17

stages:
  - test
  - build

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

# ------------------------------------------------------------------------------
# Stage 1: Chạy Unit Test & Integration Test kết nối PostgreSQL
# ------------------------------------------------------------------------------
test_job:
  stage: test
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hrms_test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: test_password
    POSTGRES_HOST_AUTH_METHOD: trust
    # Kết nối tới service PostgreSQL thông qua hostname 'postgres' do GitLab CI cung cấp
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrms_test_db
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: test_password
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew test --info

# ------------------------------------------------------------------------------
# Stage 2: Đóng gói ứng dụng thành file JAR (chỉ chạy khi test_job pass)
# ------------------------------------------------------------------------------
build_job:
  stage: build
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew build -x test
  artifacts:
    name: "app-jar-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/libs/*.jar
    expire_in: 1 day
